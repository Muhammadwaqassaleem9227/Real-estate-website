<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Messages - LuxeEstate</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .chat-sidebar {
            height: calc(100vh - 120px);
            overflow-y: auto;
            border-right: 1px solid #eee;
        }

        .chat-list-item {
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid #f8f9fa;
        }

        .chat-list-item:hover {
            background-color: #f0f7ff;
        }

        .chat-list-item.active {
            background-color: #e7f1ff;
            border-left: 4px solid var(--bs-primary);
        }

        .chat-main {
            height: calc(100vh - 120px);
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 2rem;
            background-color: #fbfbfb;
        }

        .message-bubble {
            max-width: 75%;
            margin-bottom: 1rem;
            padding: 0.8rem 1.2rem;
            border-radius: 1rem;
            position: relative;
        }

        .message-sent {
            background-color: var(--bs-primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0.2rem;
        }

        .message-received {
            background-color: white;
            color: var(--bs-dark);
            align-self: flex-start;
            border-bottom-left-radius: 0.2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .property-mini-card {
            font-size: 0.8rem;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            align-items: center;
            margin-top: 5px;
        }

        .property-mini-img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
            margin-right: 10px;
        }
    </style>
</head>

<body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg fixed-top custom-navbar bg-white shadow-sm navbar-light">
        <div class="container">
            <a class="navbar-brand text-dark" href="/">
                <i class="fa-solid fa-building-user me-2 text-primary"></i>
                <span class="fw-bold">LuxeEstate</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="listings.html">Listings</a></li>
                    <li class="nav-item"><a class="nav-link" href="add-property.html">Add Property</a></li>
                    <li class="nav-item"><a class="nav-link active" href="owner-messages.html"><i class="fa-solid fa-comments me-1"></i> Messages</a></li>
                    <li class="nav-item"><a class="nav-link" href="notifications.html"><i class="fa-regular fa-bell"></i> Notifications</a></li>
                    <li class="nav-item ms-lg-3" id="authPlaceholder">
                        <!-- Auth buttons will be injected by main.js -->
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-5 mt-5">
        <div class="container">
            <div class="row g-0 bg-white rounded-4 shadow-sm overflow-hidden reveal reveal-up">
                <!-- Sidebar -->
                <div class="col-lg-4 col-md-5 chat-sidebar">
                    <div class="p-4 border-bottom bg-white sticky-top">
                        <h4 class="fw-bold mb-0">Messages</h4>
                        <p class="text-muted small mb-0">Inquiries from potential buyers</p>
                    </div>
                    <div id="chatList" class="reveal-stagger">
                        <!-- Chat items will be loaded here -->
                        <div class="text-center py-5 text-muted">
                            <i class="fa-solid fa-spinner fa-spin fs-2 mb-3"></i>
                            <p>Loading your conversations...</p>
                        </div>
                    </div>
                </div>

                <!-- Main Chat Area -->
                <div class="col-lg-8 col-md-7 chat-main">
                    <div id="chatHeader" class="p-3 border-bottom bg-white d-none">
                        <div class="d-flex align-items-center">
                            <div id="activeUserAvatar" class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold me-3" style="width: 45px; height: 45px;">
                                ?
                            </div>
                            <div>
                                <h6 id="activeUserName" class="fw-bold mb-0">Select a conversation</h6>
                                <p id="activePropertyTitle" class="text-muted small mb-0">To start chatting</p>
                            </div>
                        </div>
                    </div>

                    <div id="chatMessagesContainer" class="chat-messages d-flex flex-column">
                        <div class="m-auto text-center text-muted py-5">
                            <i class="fa-solid fa-comments opacity-25" style="font-size: 5rem;"></i>
                            <h5 class="mt-3">Your Conversations</h5>
                            <p>Select a message thread from the left to start responding to inquiries.</p>
                        </div>
                    </div>

                    <div id="chatInputArea" class="p-3 border-top bg-white d-none">
                        <div class="input-group">
                            <input type="text" id="ownerChatInput" class="form-control border-0 bg-light rounded-pill px-4" placeholder="Type your response...">
                            <button id="ownerSendBtn" class="btn btn-primary rounded-pill px-4 ms-2 shadow-sm">
                                <i class="fa-solid fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!API.isAuthenticated()) {
                window.location.href = 'login.html?redirect=owner-messages.html';
                return;
            }

            const chatList = document.getElementById('chatList');
            const chatMessagesContainer = document.getElementById('chatMessagesContainer');
            const chatHeader = document.getElementById('chatHeader');
            const chatInputArea = document.getElementById('chatInputArea');
            const activeUserName = document.getElementById('activeUserName');
            const activePropertyTitle = document.getElementById('activePropertyTitle');
            const activeUserAvatar = document.getElementById('activeUserAvatar');
            const ownerChatInput = document.getElementById('ownerChatInput');
            const ownerSendBtn = document.getElementById('ownerSendBtn');

            let currentChat = null;

            async function loadChats() {
                try {
                    const response = await API.getOwnerChats();
                    const chats = response.data || [];
                    
                    if (chats.length === 0) {
                        chatList.innerHTML = '<div class="text-center py-5 text-muted"><p>No messages yet.</p></div>';
                        return;
                    }

                    chatList.innerHTML = '';
                    chats.forEach((chat, index) => {
                        const initials = chat.other_user_name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
                        const item = document.createElement('div');
                        item.className = 'chat-list-item p-4';
                        item.innerHTML = `
                            <div class="d-flex align-items-center">
                                <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center fw-bold me-3" style="width: 50px; height: 50px; flex-shrink: 0;">
                                    ${initials}
                                </div>
                                <div class="flex-grow-1 overflow-hidden">
                                    <div class="d-flex justify-content-between">
                                        <h6 class="fw-bold mb-1 text-truncate">${chat.other_user_name}</h6>
                                    </div>
                                    <div class="property-mini-card">
                                        <img src="${chat.property_image || 'https://via.placeholder.com/100'}" class="property-mini-img">
                                        <span class="text-truncate">${chat.property_title}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                        item.onclick = () => selectChat(chat, item);
                        chatList.appendChild(item);
                    });
                } catch (err) {
                    chatList.innerHTML = '<div class="text-center py-5 text-danger"><p>Error loading chats.</p></div>';
                }
            }

            async function selectChat(chat, element) {
                // UI feedback
                document.querySelectorAll('.chat-list-item').forEach(el => el.classList.remove('active'));
                element.classList.add('active');

                currentChat = chat;
                
                // Update Header
                activeUserName.innerText = chat.other_user_name;
                activePropertyTitle.innerText = chat.property_title;
                activeUserAvatar.innerText = chat.other_user_name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
                
                chatHeader.classList.remove('d-none');
                chatInputArea.classList.remove('d-none');
                
                loadMessages();
            }

            async function loadMessages() {
                if (!currentChat) return;
                
                try {
                    const response = await API.getChatHistory(currentChat.other_user_id, currentChat.property_id);
                    const messages = response.data || [];
                    
                    chatMessagesContainer.innerHTML = '';
                    const myId = parseInt(localStorage.getItem('user_id'));
                    
                    messages.forEach(msg => {
                        const isSent = msg.sender_id === myId;
                        const bubble = document.createElement('div');
                        bubble.className = `message-bubble ${isSent ? 'message-sent' : 'message-received'}`;
                        bubble.innerHTML = `
                            <div>${msg.message}</div>
                            <small class="opacity-50 d-block mt-1" style="font-size: 0.65rem;">${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</small>
                        `;
                        chatMessagesContainer.appendChild(bubble);
                    });
                    
                    chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;
                } catch (err) {
                    console.error("Failed to load messages", err);
                }
            }

            async function sendMessage() {
                const text = ownerChatInput.value.trim();
                if (!text || !currentChat) return;

                try {
                    await API.contactOwner({
                        property_id: currentChat.property_id,
                        receiver_id: currentChat.other_user_id,
                        message: text
                    });
                    ownerChatInput.value = '';
                    loadMessages();
                } catch (err) {
                    alert("Failed to send message");
                }
            }

            ownerSendBtn.onclick = sendMessage;
            ownerChatInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };

            // Initial load
            loadChats();
            
            // Poll for new messages every 5 seconds if a chat is open
            setInterval(() => {
                if (currentChat) loadMessages();
                else loadChats();
            }, 5000);
        });
    </script>
</body>

</html>
