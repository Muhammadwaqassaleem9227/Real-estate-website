<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - LuxeEstate</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --primary-color: #4F46E5;
            --secondary-color: #111827;
            --bg-color: #F3F4F6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #fff;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .login-icon {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border: none;
            padding: 0.8rem 2rem;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .btn-primary:hover {
            background-color: #4338CA;
            transform: translateY(-2px);
        }

        .form-control {
            border-radius: 0.75rem;
            padding: 0.75rem 1.25rem;
            background-color: #F9FAFB;
            border: 1px solid #E5E7EB;
        }

        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            border-color: var(--primary-color);
        }

        .error-message {
            color: #EF4444;
            font-size: 0.875rem;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>

<body>
    <div class="login-card reveal reveal-up">
        <div class="login-icon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2 class="fw-bold mb-2">Admin Login</h2>
        <p class="text-muted mb-4">Enter your credentials to access the panel</p>

        <form id="adminLoginForm">
            <div class="mb-3">
                <input type="email" id="username" class="form-control" placeholder="Email Address" required>
            </div>
            <div class="mb-4 position-relative">
                <input type="password" id="password" class="form-control pe-5" placeholder="Password" required>
                <span class="position-absolute top-50 end-0 translate-middle-y me-3 text-muted" style="cursor: pointer; z-index: 5;" onclick="togglePassword(this, 'password')">
                    <i class="fa-solid fa-eye"></i>
                </span>
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill">Login to Dashboard</button>
            <div id="errorMessage" class="error-message">Invalid username or password!</div>
        </form>

        <div class="mt-4">
            <a href="index.html" class="text-decoration-none text-muted small">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Website
            </a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js?v=3"></script>
    <script>
        function togglePassword(iconSpan, inputId) {
            const input = document.getElementById(inputId);
            const icon = iconSpan.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // Clear any stale session on page load to be safe
        console.log("Admin login page loaded. Current role:", localStorage.getItem('role'));

        document.getElementById('adminLoginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            
            // Clear existing session data before new login attempt
            localStorage.clear();

            const email = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const submitBtn = this.querySelector('button');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...';

            try {
                console.log("Attempting admin login for:", email);
                const response = await API.login(email, password);
                console.log("Login response:", response);
                
                if (response.role && response.role.toLowerCase() === 'admin') {
                    console.log("Admin verified. Redirecting to dashboard...");
                    window.location.href = 'admin.html';
                } else {
                    console.warn("Access denied: User is not an admin. Role found:", response.role);
                    errorMessage.innerText = 'Access Denied: You do not have administrative privileges.';
                    errorMessage.style.display = 'block';
                    // Don't call API.logout() here as it would redirect to login.html
                    localStorage.clear();
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Login to Dashboard';
                }
            } catch (err) {
                console.error("Login error:", err);
                errorMessage.innerText = 'Login Failed: ' + (err.message || 'Invalid credentials');
                errorMessage.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Login to Dashboard';
            }
        });
    </script>
</body>

</html>
