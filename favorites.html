<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites - LuxeEstate</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg fixed-top bg-white shadow-sm custom-navbar navbar-light">
        <div class="container">
            <a class="navbar-brand text-dark" href="/">
                <i class="fa-solid fa-building-user me-2 text-primary"></i>
                <span class="fw-bold">LuxeEstate</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="listings.html">Listings</a></li>
                    <li class="nav-item"><a class="nav-link" href="add-property.html">Add Property</a></li>
                    <li class="nav-item"><a class="nav-link" href="predict.html"><i
                                class="fa-solid fa-wand-magic-sparkles text-warning me-1"></i> Predict Price</a></li>
                    <li class="nav-item"><a class="nav-link active" href="favorites.html"><i
                                class="fa-solid fa-heart"></i> Favorites</a></li>
                    <li class="nav-item position-relative">
                        <a class="nav-link" href="notifications.html">
                            <i class="fa-regular fa-bell"></i>
                            <span id="navNotificationBadge"
                                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none"
                                style="font-size: 0.6rem;">0</span>
                        </a>
                    </li>
                    <li class="nav-item"><a class="nav-link text-primary fw-bold" href="admin-login.html"><i class="fa-solid fa-shield-halved me-1"></i> Admin</a></li>
                    <li class="nav-item ms-lg-3">
                        <div class="dropdown">
                            <button class="btn btn-outline-dark rounded-pill px-4 dropdown-toggle" type="button"
                                data-bs-toggle="dropdown">
                                <i class="fa-regular fa-user me-2"></i> My Account
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-4 mt-2">
                                <li><a class="dropdown-item" href="#">Profile Settings</a></li>
                                <li><a class="dropdown-item" href="#">My Listings</a></li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li><a class="dropdown-item text-danger" href="index.html">Logout</a></li>
                            </ul>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header & Content -->
    <div class="container py-5 mt-5">
        <div class="d-flex justify-content-between align-items-center mb-5 pb-3 border-bottom pt-4 reveal reveal-up">
            <div>
                <h1 class="display-6 fw-bold mb-1">Your Saved Properties</h1>
                <p class="text-muted mb-0">Manage your favorite real estate picks</p>
            </div>
        </div>

        <div class="row g-4 reveal-stagger" id="favoritesContainer">
            <div class="col-12 text-center py-5 text-muted">
                <i class="fa-solid fa-spinner fa-spin fs-2 mb-3"></i>
                <p>Loading your favorites...</p>
            </div>
        </div>

    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!API.isAuthenticated()) {
                window.location.href = 'login.html';
                return;
            }

            const container = document.getElementById('favoritesContainer');
            
            try {
                const favRes = await API.getFavorites();
                const favIds = favRes.favorite_ids || [];
                
                if (favIds.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center py-5 bg-white rounded-4 shadow-sm">
                            <div class="icon-box bg-light text-danger rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 80px; height: 80px;">
                                <i class="fa-regular fa-heart fs-1"></i>
                            </div>
                            <h4 class="fw-bold mb-2">No favorites yet</h4>
                            <p class="text-muted mb-4">Start exploring properties and save the ones you like.</p>
                            <a href="listings.html" class="btn btn-primary rounded-pill px-4">Browse Properties</a>
                        </div>`;
                    return;
                }
                
                const propRes = await API.getProperties();
                const allProps = Array.isArray(propRes) ? propRes : (propRes.data || []);
                const favProps = allProps.filter(p => favIds.includes(p.id));
                
                if (favProps.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center py-5 bg-white rounded-4 shadow-sm">
                            <h4 class="fw-bold mb-2">No favorites yet</h4>
                            <a href="listings.html" class="btn btn-primary rounded-pill px-4">Browse Properties</a>
                        </div>`;
                    return;
                }

                let html = '';
                favProps.forEach((p, index) => {
                    const priceValue = Number(p.price ?? 0);
                    const formattedPrice = Number.isFinite(priceValue) ? priceValue.toLocaleString() : '0';
                    const propertyType = p.property_type || 'Property';
                    const imageUrl = p.image_url || 'https://via.placeholder.com/400x300';
                    const title = p.title || 'Untitled Property';
                    const location = p.location || 'Location not provided';
                    const area = p.area ?? '-';
                    const delay = (index % 4) * 0.15;
                    
                    html += `<div class="col-md-6 col-lg-4 reveal reveal-up" style="transition-delay: ${delay}s;">
                        <div class="property-card card border-0 rounded-4 shadow-sm overflow-hidden h-100" style="cursor: pointer;" onclick="window.location.href='details.html?id=${p.id}'">
                            <div class="position-relative overflow-hidden">
                                <img src="${imageUrl}" class="card-img-top property-img" alt="${title}" style="height: 200px; object-fit: cover;">
                                <button class="btn btn-light rounded-circle position-absolute top-0 end-0 m-3 shadow-sm favorite-btn" data-id="${p.id}" onclick="event.stopPropagation(); removeFavoriteAndRefresh(${p.id}, this);">
                                    <i class="fa-solid fa-heart text-danger"></i>
                                </button>
                                <div class="position-absolute bottom-0 start-0 m-3">
                                    <span class="badge bg-primary px-3 py-2 rounded-pill shadow-sm fs-6">PKR ${formattedPrice}</span>
                                </div>
                            </div>
                            <div class="card-body p-4">
                                <div class="text-muted small mb-2">
                                    <i class="fa-solid fa-location-dot me-1 text-primary"></i> ${location}
                                </div>
                                <h5 class="card-title fw-bold mb-3">${title}</h5>
                                <div class="d-flex flex-wrap gap-2 text-muted border-top pt-3 mt-3 small fw-medium">
                                    <span class="bg-light px-2 py-1 rounded border">
                                        <i class="fa-solid fa-vector-square me-1 text-primary"></i> ${area} Marla
                                    </span>
                                    ${p.bedrooms ? `<span class="bg-light px-2 py-1 rounded border"><i class="fa-solid fa-bed me-1 text-primary"></i> ${p.bedrooms}</span>` : ''}
                                </div>
                                <div class="mt-3">
                                    <span class="badge bg-secondary-soft text-secondary border px-2 py-1">${propertyType.toUpperCase()}</span>
                                </div>
                            </div>
                        </div>
                    </div>`;
                });
                
                container.innerHTML = html;
                
            } catch (err) {
                container.innerHTML = `<div class="col-12 alert alert-danger">Failed to load favorites: ${err.message}</div>`;
            }
        });
        
        window.removeFavoriteAndRefresh = async function(id, btn) {
            try {
                await API.removeFavorite(id);
                const col = btn.closest('.col-md-6');
                col.style.opacity = '0.5';
                col.style.pointerEvents = 'none';
                setTimeout(() => {
                    col.remove();
                    if (document.querySelectorAll('#favoritesContainer .col-md-6').length === 0) {
                        location.reload();
                    }
                }, 300);
            } catch (e) {
                alert('Failed to remove favorite.');
            }
        };
    </script>
</body>

</html>
